; RoundMacroController V2 - ESP32-S3 PlatformIO Configuration
; Target Hardware: Guition JC3636W518C (ESP32-S3R8, 16MB Flash, 8MB OPI PSRAM, 360x360 Round Touch)
;
; Build Environments:
;   1) jc3636w518c_usb_composite : Native TinyUSB OTG (USB CDC + USB HID Keyboard simultaneously)
;   2) jc3636w518c_cdc_only      : Hardware USB CDC only (safe initial bring-up & PC_AGENT macro mode)
;
; IMPORTANT: Verify physical board revision pins in include/board_config.h before flashing!

[platformio]
default_envs = jc3636w518c_usb_composite

[env]
platform = espressif32 @ ^6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.0
  moononournation/GFX Library for Arduino @ ^1.4.9

[env:jc3636w518c_usb_composite]
; Native USB-OTG via TinyUSB: enables simultaneous USB CDC (Protocol V2) + USB HID Keyboard
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DRMC_ENABLE_USB_HID=1
  -DRMC_ENABLE_ST77916_DRIVER=1
  -DRMC_ENABLE_CST816S_DRIVER=1
  -DRMC_FIRMWARE_VERSION=\"2.0.0-rc1\"

[env:jc3636w518c_cdc_only]
; Fallback Hardware CDC mode without USB HID (useful if Windows TinyUSB composite enumeration needs troubleshooting)
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DRMC_ENABLE_USB_HID=0
  -DRMC_ENABLE_ST77916_DRIVER=1
  -DRMC_ENABLE_CST816S_DRIVER=1
  -DRMC_FIRMWARE_VERSION=\"2.0.0-rc1-cdc\"
